  <style>
    :root{
      --bg:#0e1117;
      --card:#161b22;
      --border:#30363d;
      --text:#e6edf3;
      --muted:#8b949e;
      --accent:#58a6ff;
      --accent-soft:#dbeafe;
    }
    *{ box-sizing:border-box; }
    body { margin:0; font-family:"IBM Plex Sans", system-ui, sans-serif; color:var(--text); background:var(--bg); }
    .page { max-width:1340px; margin:0 auto; padding:18px 20px 24px; }
    .back-link {
      display:inline-block;
      color:var(--accent-soft);
      text-decoration:none;
      margin-bottom:10px;
      font-size:14px;
    }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; }
    .header { padding:14px 16px; margin-bottom:10px; }
    .title { margin:0; font-size:22px; }
    .small { color:var(--muted); font-size:12px; }
    .combo-strip {
      margin-top:10px;
      border:1px solid #355782;
      border-radius:8px;
      background:#0f1d30;
      padding:10px;
    }
    .combo-strip-title { margin:0 0 6px; font-size:13px; color:#dbeafe; }
    .combo-strip-row { display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap; margin-top:6px; }
    .combo-tag {
      border:1px solid #53729a;
      border-radius:999px;
      background:#173253;
      color:#dbeafe;
      padding:2px 7px;
      font-size:11px;
      line-height:1.3;
      white-space:nowrap;
    }
    .combo-pair {
      border:1px solid #486488;
      border-radius:8px;
      background:#13263f;
      color:#dbeafe;
      padding:3px 7px;
      font-size:11px;
      line-height:1.3;
    }

    .controls {
      padding:10px 12px;
      display:grid;
      grid-template-columns:220px 1fr auto auto;
      gap:8px;
      align-items:center;
      margin-bottom:10px;
    }
    select, input, button {
      border-radius:8px;
      border:1px solid var(--border);
      background:#0f1720;
      color:var(--text);
      font-size:13px;
      padding:9px 11px;
    }
    button { cursor:pointer; }
    button.secondary { background:#203049; }
    button:disabled { cursor:not-allowed; opacity:0.55; }
    .pager { display:flex; gap:8px; }

    .layout {
      display:grid;
      grid-template-columns:340px 1fr;
      gap:10px;
      min-height:600px;
    }

    .list-panel { padding:10px; display:flex; flex-direction:column; }
    .list-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .list-title { margin:0; font-size:16px; }
    .list-body { border:1px solid var(--border); border-radius:8px; overflow:auto; }
    .link-row {
      width:100%;
      text-align:left;
      border:none;
      border-bottom:1px solid #27303a;
      background:transparent;
      color:var(--text);
      padding:9px 10px;
      cursor:pointer;
    }
    .link-row:last-child { border-bottom:none; }
    .link-row:hover { background:#0f1a27; }
    .link-row.active { background:#13213a; outline:1px solid #315a8e; }
    .row-main { font-size:12px; color:#dbeafe; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row-sub { margin-top:3px; font-size:11px; color:#9fb1c3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .detail-panel { padding:12px; }
    .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; word-break:break-all; }

    .equiv-box {
      border:1px solid var(--border);
      border-radius:8px;
      padding:10px;
      background:#0c141d;
    }
    .equiv-title { margin:0 0 8px; font-size:15px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:7px 8px; font-size:12px; border-bottom:1px solid #27303a; vertical-align:top; }
    th { text-align:left; color:#9fb6cf; font-weight:700; }
    tr.configured-pair td {
      background:rgba(56, 139, 253, 0.1);
    }
    .empty { color:var(--muted); font-style:italic; }
    .cell-prop { display:block; color:var(--accent-soft); font-weight:700; margin-bottom:3px; }
    .cell-prop-row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:3px; }
    .cell-prop-badge {
      display:inline-flex;
      align-items:center;
      border:1px solid #4f709b;
      border-radius:999px;
      background:#1b3554;
      color:#dbeafe;
      font-size:10px;
      padding:1px 6px;
      line-height:1.4;
      text-transform:uppercase;
      letter-spacing:0.03em;
    }
    .cell-values { color:var(--muted); font-size:11px; line-height:1.35; word-break:break-word; }
    .value-lines {
      display:flex;
      flex-direction:column;
      gap:4px;
      margin-top:4px;
    }
    .value-line {
      display:block;
      width:100%;
      text-align:left;
      border:none;
      background:transparent;
      color:#d1e4f8;
      font-size:11px;
      line-height:1.3;
      padding:0;
      word-break:break-word;
    }
    .value-line.literal {
      color:#b8cadb;
    }
    .value-line.node-static {
      color:#b8cadb;
    }
    .node-tree {
      margin:2px 0;
      padding-left:8px;
      border-left:1px dashed #3a4653;
    }
    .node-tree > summary {
      cursor:pointer;
      color:#dbeafe;
      font-size:11px;
      line-height:1.3;
      list-style:disclosure-closed;
    }
    .node-tree[open] > summary {
      list-style:disclosure-open;
      margin-bottom:4px;
    }
    .node-tree-body {
      border:1px solid #2f3e4d;
      border-radius:7px;
      background:#101925;
      padding:6px 7px;
    }
    .tree-sections {
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
    }
    .tree-section {
      border:1px solid #2b3744;
      border-radius:7px;
      padding:6px;
      background:#0d141d;
    }
    .tree-section-title { margin:0 0 6px; color:#9fb6cf; font-size:12px; }
    .tree-prop { margin-bottom:8px; }
    .tree-prop:last-child { margin-bottom:0; }
    .tree-prop-title {
      display:block;
      color:#dbeafe;
      font-size:11px;
      margin-bottom:4px;
      line-height:1.2;
      word-break:break-word;
    }
    .tree-state { color:var(--muted); font-size:11px; }

    @media (max-width: 1080px) {
      .controls { grid-template-columns:1fr; }
      .layout { grid-template-columns:1fr; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
