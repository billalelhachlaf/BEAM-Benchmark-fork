services:
  webapp:
    command:
      - python
      - -m
      - uvicorn
      - webapp.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8501"
      - --reload
    volumes:
      - ./:/app
      - ./docker-data:/state

  worker:
    volumes:
      - ./:/app
      - ./docker-data:/state
