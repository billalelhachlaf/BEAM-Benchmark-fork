<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BEAM Tutorial</title>
  <style>
    :root{--bg:#0e1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e}
    *{box-sizing:border-box}
    body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--text)}
    .page{max-width:1200px;margin:0 auto;padding:24px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
    h1{margin:0 0 12px;font-size:28px}
    h2{margin:0 0 8px;font-size:20px}
    h3{margin:0 0 8px;font-size:16px}
    .small{color:var(--muted);font-size:12px}
    a{color:#bfdbfe;text-decoration:none}
    code{background:#0b1220;padding:1px 5px;border-radius:6px}
    pre{background:#0b1220;border:1px solid var(--border);border-radius:8px;padding:12px;overflow:auto}
    ul,ol{padding-left:20px}
    .toc ul{margin:8px 0}
    .warn{border:1px solid #7f1d1d;background:#2a0f10;color:#ffd6d6;border-radius:8px;padding:10px}
  </style>
</head>
<body>
  <div class="page">
    <a href="/{% if is_test_mode %}?test_mode=1{% endif %}">&larr; Back to dashboard</a>
    <h1>Tutorial</h1>

    <div class="card">
      <div class="small">Source: <code>{{ tutorial_source_path }}</code></div>
    </div>

    {% if tutorial_ok and tutorial_sections %}
    <div class="card toc">
      <h2>Contents</h2>
      <ul>
        {% for s in tutorial_sections %}
        <li><a href="#{{ s.anchor }}">{{ s.title }}</a></li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}

    <div class="card">
      {% if not tutorial_ok %}
      <div class="warn">{{ tutorial_error }}</div>
      {% else %}
      {{ tutorial_html|safe }}
      {% endif %}
    </div>
  </div>
</body>
</html>
